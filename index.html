<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProDigy Infotech - Task 01</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Poppins', sans-serif;
}

body{
    scroll-behavior:smooth;
}

/* ===== NAVBAR ===== */
nav{
    position:fixed;
    width:100%;
    top:0;
    left:0;
    padding:20px 60px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    transition:0.4s;
    z-index:1000;
}

.logo{
    font-size:24px;
    font-weight:700;
    color:white;
}

nav ul{
    display:flex;
    list-style:none;
}

nav ul li{
    margin:0 20px;
}

nav ul li a{
    text-decoration:none;
    color:white;
    font-weight:500;
    position:relative;
    transition:0.3s;
}

/* Hover underline */
nav ul li a::after{
    content:"";
    position:absolute;
    left:0;
    bottom:-5px;
    width:0%;
    height:2px;
    background:#00f2fe;
    transition:0.4s;
}

nav ul li a:hover::after{
    width:100%;
}

nav ul li a:hover{
    color:#00f2fe;
}

/* Scroll Effect */
nav.scrolled{
    background:rgba(0,0,0,0.8);
    backdrop-filter:blur(8px);
    padding:15px 60px;
}

/* ===== HOME SECTION WITH IMAGE ===== */
#home{
    height:100vh;
    background: url('https://images.unsplash.com/photo-1498050108023-c5249f4df085') no-repeat center center/cover;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
}

/* Dark Overlay */
#home::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
}

.home-content{
    position:relative;
    z-index:2;
}

.home-content h1{
    font-size:55px;
    margin-bottom:20px;
}

.home-content p{
    font-size:20px;
}

/* Other Sections */
section{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    color:white;
}

#about{
    background:linear-gradient(to right,#f7971e,#ffd200);
}

#services{
    background:linear-gradient(to right,#8e2de2,#4a00e0);
}

#contact{
    background:linear-gradient(to right,#ff416c,#ff4b2b);
}

/* Responsive */
@media(max-width:768px){
    nav{
        padding:15px 20px;
    }
    .home-content h1{
        font-size:35px;
    }
}
</style>
</head>

<body>

<nav id="navbar">
    <div class="logo">ProDigy Infotech</div>
    <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#services">Services</a></li>
        <li><a href="#contact">Contact</a></li>
    </ul>
</nav>

<section id="home">
    <div class="home-content">
        <h1>Responsive Landing Page</h1>
        <p>Task-01 | ProDigy Infotech Internship</p>
    </div>
</section>

<section id="about">About Section</section>
<section id="services">Services Section</section>
<section id="contact">Contact Section</section>

<script>
window.addEventListener("scroll", function(){
    const navbar = document.getElementById("navbar");
    navbar.classList.toggle("scrolled", window.scrollY > 50);
});
</script>

</body>
</html>
